# Lokální IBM MQ (developer edice) pro testování.
# Queue manager QM1, kanál DEV.APP.SVRCONN, uživatel app, fronty DEV.QUEUE.1-3
# Web konzole: https://localhost:9443/ibmmq/console (admin / passw0rd)
services:
  ibmmq:
    image: icr.io/ibm-messaging/mq:latest
    container_name: ibmmq
    ports:
      - "1414:1414"
      - "9443:9443"
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM1
      MQ_APP_PASSWORD: passw0rd
      MQ_ADMIN_PASSWORD: passw0rd
    volumes:
      - mqdata:/mnt/mqm

volumes:
  mqdata:
